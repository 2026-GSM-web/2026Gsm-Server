name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # NOTE: full `./gradlew test` needs a reachable MySQL instance and the
      # OAuth2/JWT env vars from CLAUDE.md (SchoolwebApplicationTests loads the
      # full Spring context). Until tests are split into "pure unit" vs
      # "needs DB" groups, CI only verifies the project compiles.
      - name: Compile
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon
